services:
  - type: web
    name: maize-market-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn efficientnet_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
    disk:
      name: models
      mountPath: /opt/render/project/src/models
      sizeGB: 2
