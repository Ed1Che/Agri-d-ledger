services:
  postgres:
    image: postgres:15-alpine
    container_name: agridl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agridl
    ports:
      - '5433:5432'
    volumes:
      - agridl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agridl']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agridl-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - agridl_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agridl_postgres_data:
  agridl_redis_data:
